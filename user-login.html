<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account — MaheshwariSales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#0a0a0a; --bg2:#111; --bg3:#1a1a1a; --gold:#c9a84c; --gold-light:#e8c97a; --gold-dim:#7a6030; --silver:#b8bec7; --silver-dim:#6b7280; --white:#f5f0e8; --error:#e05c5c; --success:#4caf82; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body { background:var(--bg); font-family:'Jost',sans-serif; font-weight:300; min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:none; }

    .bg-canvas { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse 80% 50% at 20% 40%,rgba(201,168,76,0.06) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 70%,rgba(184,190,199,0.04) 0%,transparent 50%),#0a0a0a; }
    .bg-grid { position:fixed; inset:0; z-index:0; background-image:linear-gradient(rgba(201,168,76,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,0.04) 1px,transparent 1px); background-size:60px 60px; mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%); }

    .cursor-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
    .cursor-ring{width:28px;height:28px;border:1px solid rgba(201,168,76,0.5);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all 0.15s ease;}

    .account-wrap { position:relative; z-index:10; width:100%; max-width:460px; padding:0 20px; animation:cardIn 0.7s cubic-bezier(0.34,1.2,0.64,1) forwards; }
    @keyframes cardIn { from{opacity:0;transform:translateY(28px) scale(0.97);} to{opacity:1;transform:translateY(0) scale(1);} }

    .account-card { background:rgba(255,255,255,0.035); backdrop-filter:blur(40px) saturate(1.5); -webkit-backdrop-filter:blur(40px) saturate(1.5); border:1px solid rgba(201,168,76,0.18); padding:48px 44px; position:relative; overflow:hidden; }
    .account-card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(201,168,76,0.6),transparent); }

    /* Brand */
    .brand { text-align:center; margin-bottom:32px; }
    .brand-logo { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:300; color:var(--white); letter-spacing:0.1em; }
    .brand-logo span { color:var(--gold); font-style:italic; }
    .brand-sub { font-size:0.6rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--silver-dim); margin-top:4px; }

    /* Tabs */
    .auth-tabs { display:grid; grid-template-columns:1fr 1fr; gap:0; margin-bottom:32px; border:1px solid rgba(201,168,76,0.15); }
    .auth-tab { padding:12px; background:none; border:none; font-family:'Jost',sans-serif; font-size:0.68rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--silver-dim); cursor:none; transition:all 0.3s; }
    .auth-tab.active { background:rgba(201,168,76,0.1); color:var(--gold); }
    .auth-tab:first-child { border-right:1px solid rgba(201,168,76,0.15); }

    /* Alert */
    .auth-alert { padding:12px 16px; font-size:0.73rem; letter-spacing:0.04em; margin-bottom:18px; display:none; border-radius:1px; }
    .auth-alert.error { background:rgba(224,92,92,0.08); border:1px solid rgba(224,92,92,0.25); color:var(--error); }
    .auth-alert.success { background:rgba(76,175,130,0.08); border:1px solid rgba(76,175,130,0.25); color:var(--success); }
    .auth-alert.show { display:block; }

    /* Form */
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:0.6rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--silver-dim); margin-bottom:7px; }
    .form-input-wrap { position:relative; }
    .form-input { width:100%; padding:12px 16px 12px 40px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); color:var(--white); font-family:'Jost',sans-serif; font-size:0.85rem; outline:none; transition:border-color 0.3s,background 0.3s; }
    .form-input::placeholder { color:var(--silver-dim); }
    .form-input:focus { border-color:rgba(201,168,76,0.5); background:rgba(201,168,76,0.03); }
    .form-input.error { border-color:rgba(224,92,92,0.5); }
    .form-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--silver-dim); pointer-events:none; transition:color 0.3s; }
    .form-input:focus ~ .form-icon, .form-input-wrap:focus-within .form-icon { color:var(--gold-dim); }
    .pw-toggle { position:absolute; right:13px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--silver-dim); cursor:none; transition:color 0.3s; }
    .pw-toggle:hover { color:var(--gold); }

    /* Submit */
    .btn-auth { width:100%; padding:14px; background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:var(--bg); font-family:'Jost',sans-serif; font-size:0.72rem; font-weight:500; letter-spacing:0.25em; text-transform:uppercase; border:none; cursor:none; margin-top:6px; position:relative; overflow:hidden; transition:transform 0.3s,box-shadow 0.3s,opacity 0.3s; }
    .btn-auth:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 8px 28px rgba(201,168,76,0.3); }
    .btn-auth:disabled { opacity:0.55; }
    .btn-text { transition:opacity 0.3s; }
    .btn-loader { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
    .btn-auth.loading .btn-text { opacity:0; }
    .btn-auth.loading .btn-loader { display:flex; }
    .spinner { width:18px; height:18px; border:2px solid rgba(10,10,10,0.3); border-top-color:var(--bg); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin{to{transform:rotate(360deg);}}

    /* Logged in state */
    .logged-in-state { text-align:center; }
    .user-avatar { width:64px; height:64px; border-radius:50%; background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.3); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-family:'Cormorant Garamond',serif; font-size:1.8rem; color:var(--gold); }
    .user-greeting { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:300; color:var(--white); margin-bottom:4px; }
    .user-email { font-size:0.72rem; color:var(--silver-dim); letter-spacing:0.08em; margin-bottom:28px; }
    .account-links { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
    .account-link { display:flex; flex-direction:column; align-items:center; gap:7px; padding:16px 12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); color:var(--silver); text-decoration:none; font-size:0.65rem; letter-spacing:0.15em; text-transform:uppercase; transition:all 0.3s; cursor:none; }
    .account-link:hover { border-color:rgba(201,168,76,0.25); color:var(--gold); background:rgba(201,168,76,0.05); }
    .account-link svg { color:var(--gold-dim); }
    .btn-signout { width:100%; padding:12px; background:none; border:1px solid rgba(255,255,255,0.08); color:var(--silver-dim); font-family:'Jost',sans-serif; font-size:0.68rem; letter-spacing:0.18em; text-transform:uppercase; cursor:none; transition:all 0.3s; }
    .btn-signout:hover { border-color:rgba(224,92,92,0.3); color:#e05c5c; }

    .card-footer { text-align:center; margin-top:24px; }
    .card-footer a { font-size:0.68rem; color:var(--silver-dim); text-decoration:none; transition:color 0.3s; }
    .card-footer a:hover { color:var(--gold); }

    .secure-badge { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:20px; font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--silver-dim); }
    .secure-badge svg { color:var(--gold-dim); }
  </style>
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>

  <div class="account-wrap">
    <div class="account-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-logo">Maheshwari<span>Sales</span></div>
        <div class="brand-sub">My Account</div>
      </div>

      <!-- ── LOGGED IN VIEW ── -->
      <div id="loggedInView" style="display:none">
        <div class="logged-in-state">
          <div class="user-avatar" id="userAvatar">A</div>
          <div class="user-greeting">Welcome back!</div>
          <div class="user-email" id="userEmailDisplay"></div>
          <div class="account-links">
            <a href="products.html" class="account-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              Shop Now
            </a>
            <a href="gallery.html" class="account-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              Gallery
            </a>
            <a href="index.html" class="account-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Home
            </a>
            <a href="#" class="account-link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Profile
            </a>
          </div>
          <button class="btn-signout" id="signOutBtn">Sign Out</button>
        </div>
      </div>

      <!-- ── AUTH FORMS VIEW ── -->
      <div id="authView">
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabSignIn">Sign In</button>
          <button class="auth-tab" id="tabSignUp">Create Account</button>
        </div>

        <!-- Alert -->
        <div class="auth-alert" id="authAlert"></div>

        <!-- SIGN IN FORM -->
        <div id="signInForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="form-input-wrap">
              <input class="form-input" id="siEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
              <svg class="form-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="form-input-wrap">
              <input class="form-input" id="siPassword" type="password" placeholder="••••••••" autocomplete="current-password"/>
              <svg class="form-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <button type="button" class="pw-toggle" id="siPwToggle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button class="btn-auth" id="signInBtn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader"><div class="spinner"></div></span>
          </button>
        </div>

        <!-- SIGN UP FORM -->
        <div id="signUpForm" style="display:none">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <div class="form-input-wrap">
              <input class="form-input" id="suName" type="text" placeholder="Your Name" autocomplete="name"/>
              <svg class="form-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="form-input-wrap">
              <input class="form-input" id="suEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
              <svg class="form-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="form-input-wrap">
              <input class="form-input" id="suPassword" type="password" placeholder="Min. 6 characters" autocomplete="new-password"/>
              <svg class="form-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <button type="button" class="pw-toggle" id="suPwToggle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button class="btn-auth" id="signUpBtn">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader"><div class="spinner"></div></span>
          </button>
        </div>
      </div>

      <div class="card-footer">
        <a href="index.html">← Back to Store</a>
      </div>

      <div class="secure-badge">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Secured by Supabase Auth
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient(
      'https://pwlappfcyqechcoiqcjk.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bGFwcGZjeXFlY2hjb2lxY2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzA0NjUsImV4cCI6MjA4ODU0NjQ2NX0.364XmLPVCFGDVlrdNrW_JAOUQXmAKDYyp_mfKDmMUGI'
    );

    function showAlert(msg, type='error') {
      const el = document.getElementById('authAlert');
      el.textContent = msg; el.className = `auth-alert ${type} show`;
    }
    function hideAlert() { document.getElementById('authAlert').classList.remove('show'); }

    function setLoading(btn, loading) {
      btn.classList.toggle('loading', loading);
      btn.disabled = loading;
    }

    // Check existing session
    const { data: { session } } = await supabase.auth.getSession();
    if (session) showLoggedIn(session.user);

    function showLoggedIn(user) {
      document.getElementById('authView').style.display = 'none';
      document.getElementById('loggedInView').style.display = 'block';
      document.getElementById('userEmailDisplay').textContent = user.email;
      document.getElementById('userAvatar').textContent = user.email[0].toUpperCase();
    }
    function showAuthForms() {
      document.getElementById('authView').style.display = 'block';
      document.getElementById('loggedInView').style.display = 'none';
    }

    // Tabs
    document.getElementById('tabSignIn').addEventListener('click', () => {
      document.getElementById('tabSignIn').classList.add('active');
      document.getElementById('tabSignUp').classList.remove('active');
      document.getElementById('signInForm').style.display = 'block';
      document.getElementById('signUpForm').style.display = 'none';
      hideAlert();
    });
    document.getElementById('tabSignUp').addEventListener('click', () => {
      document.getElementById('tabSignUp').classList.add('active');
      document.getElementById('tabSignIn').classList.remove('active');
      document.getElementById('signUpForm').style.display = 'block';
      document.getElementById('signInForm').style.display = 'none';
      hideAlert();
    });

    // Password toggles
    function pwToggle(inputId, btn) {
      const inp = document.getElementById(inputId);
      btn.addEventListener('click', () => { inp.type = inp.type==='password'?'text':'password'; });
    }
    pwToggle('siPassword', document.getElementById('siPwToggle'));
    pwToggle('suPassword', document.getElementById('suPwToggle'));

    // Sign In
    document.getElementById('signInBtn').addEventListener('click', async () => {
      const email = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      if (!email || !password) { showAlert('Please fill in all fields'); return; }
      const btn = document.getElementById('signInBtn');
      setLoading(btn, true); hideAlert();
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      setLoading(btn, false);
      if (error) { showAlert(error.message === 'Invalid login credentials' ? 'Invalid email or password.' : error.message); return; }
      showLoggedIn(data.user);
    });

    // Sign Up
    document.getElementById('signUpBtn').addEventListener('click', async () => {
      const name     = document.getElementById('suName').value.trim();
      const email    = document.getElementById('suEmail').value.trim();
      const password = document.getElementById('suPassword').value;
      if (!name || !email || !password) { showAlert('Please fill in all fields'); return; }
      if (password.length < 6) { showAlert('Password must be at least 6 characters'); return; }
      const btn = document.getElementById('signUpBtn');
      setLoading(btn, true); hideAlert();
      const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: name } } });
      setLoading(btn, false);
      if (error) { showAlert(error.message); return; }
      if (data.user && !data.session) {
        showAlert('Account created! Please check your email to confirm your account.', 'success');
      } else if (data.session) {
        showLoggedIn(data.user);
      }
    });

    // Sign Out
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      showAuthForms();
    });

    // Cursor
    const dot=document.getElementById('cursorDot'),ring=document.getElementById('cursorRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    (function a(){dot.style.left=mx+'px';dot.style.top=my+'px';rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(a);})();
  </script>
</body>
</html>
