<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — MaheshwariSales</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0a; --bg2: #111; --bg3: #1a1a1a;
      --gold: #c9a84c; --gold-light: #e8c97a; --gold-dim: #7a6030;
      --silver: #b8bec7; --silver-dim: #6b7280; --white: #f5f0e8;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(201,168,76,0.2);
      --error: #e05c5c; --success: #4caf82;
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: var(--bg);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
      position: relative;
    }

    /* Animated background */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(201,168,76,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 70%, rgba(184,190,199,0.04) 0%, transparent 50%),
        #0a0a0a;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
    }
    .bg-orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; z-index: 0;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .bg-orb-1 { width:400px; height:400px; background:rgba(201,168,76,0.05); top:-100px; right:-100px; animation-delay:0s; }
    .bg-orb-2 { width:300px; height:300px; background:rgba(184,190,199,0.04); bottom:-80px; left:-80px; animation-delay:-4s; }
    @keyframes orbFloat {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* Cursor */
    .cursor-dot { width:5px; height:5px; background:var(--gold); border-radius:50%; position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
    .cursor-ring { width:28px; height:28px; border:1px solid rgba(201,168,76,0.5); border-radius:50%; position:fixed; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:all 0.15s ease; }

    /* Login Card */
    .login-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 440px;
      padding: 0 20px;
      animation: cardIn 0.8s cubic-bezier(0.34,1.2,0.64,1) forwards;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(30px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    .login-card {
      background: rgba(255,255,255,0.035);
      backdrop-filter: blur(40px) saturate(1.5);
      -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 2px;
      padding: 52px 44px;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.6), transparent);
    }
    .login-card::after {
      content:'';
      position:absolute; bottom:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2), transparent);
    }

    /* Brand */
    .login-brand {
      text-align: center; margin-bottom: 40px;
    }
    .login-brand-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 52px; height: 52px;
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 50%;
      margin: 0 auto 16px;
      color: var(--gold); font-size: 1.2rem;
      background: rgba(201,168,76,0.06);
    }
    .login-brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 300;
      color: var(--white); letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .login-brand-name span { color: var(--gold); font-style: italic; }
    .login-brand-sub {
      font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--silver-dim);
    }

    /* Divider */
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px;
    }
    .login-divider::before, .login-divider::after {
      content:''; flex:1; height:1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.2));
    }
    .login-divider::after { transform: scaleX(-1); }
    .login-divider span {
      font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--gold-dim); white-space: nowrap;
    }

    /* Form */
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--silver-dim); margin-bottom: 8px;
    }
    .form-input-wrap { position: relative; }
    .form-input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--white);
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem; letter-spacing: 0.03em;
      outline: none;
      transition: border-color 0.3s ease, background 0.3s ease;
      border-radius: 1px;
    }
    .form-input::placeholder { color: var(--silver-dim); }
    .form-input:focus {
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.04);
    }
    .form-input.error { border-color: rgba(224,92,92,0.5); }
    .form-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--silver-dim); pointer-events: none;
      transition: color 0.3s ease;
    }
    .form-input:focus ~ .form-icon { color: var(--gold-dim); }
    .form-input-wrap:focus-within .form-icon { color: var(--gold-dim); }

    /* Password toggle */
    .pw-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--silver-dim);
      cursor: none; transition: color 0.3s ease;
    }
    .pw-toggle:hover { color: var(--gold); }

    /* Error message */
    .form-error {
      display: none;
      font-size: 0.68rem; color: var(--error);
      margin-top: 6px; letter-spacing: 0.05em;
    }
    .form-error.show { display: block; }

    /* Global error banner */
    .login-alert {
      padding: 12px 16px;
      background: rgba(224,92,92,0.08);
      border: 1px solid rgba(224,92,92,0.25);
      color: var(--error);
      font-size: 0.75rem; letter-spacing: 0.05em;
      margin-bottom: 20px;
      display: none;
      border-radius: 1px;
    }
    .login-alert.show { display: block; }

    /* Submit Button */
    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--bg);
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase;
      border: none; cursor: none;
      position: relative; overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
      margin-top: 8px;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(201,168,76,0.3);
    }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-login .btn-text { transition: opacity 0.3s ease; }
    .btn-login .btn-loader {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
    }
    .btn-login.loading .btn-text { opacity: 0; }
    .btn-login.loading .btn-loader { display: flex; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(10,10,10,0.3);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .login-footer {
      text-align: center; margin-top: 28px;
    }
    .login-footer a {
      font-size: 0.68rem; color: var(--silver-dim); letter-spacing: 0.1em;
      text-decoration: none; transition: color 0.3s ease;
    }
    .login-footer a:hover { color: var(--gold); }

    /* Secure badge */
    .secure-badge {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-top: 24px;
      font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--silver-dim);
    }
    .secure-badge svg { color: var(--gold-dim); }
  </style>
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="login-brand-name">Maheshwari<span>Sales</span></div>
        <div class="login-brand-sub">Admin Portal</div>
      </div>

      <div class="login-divider"><span>Sign In to Continue</span></div>

      <!-- Alert -->
      <div class="login-alert" id="loginAlert"></div>

      <!-- Form -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="emailInput">Email Address</label>
          <div class="form-input-wrap">
            <input
              class="form-input" id="emailInput"
              type="email" placeholder="admin@example.com"
              autocomplete="email" required
            />
            <svg class="form-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
          <div class="form-error" id="emailError">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="form-input-wrap">
            <input
              class="form-input" id="passwordInput"
              type="password" placeholder="••••••••"
              autocomplete="current-password" required
            />
            <svg class="form-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password">
              <svg id="pwEyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="form-error" id="passwordError">Password must be at least 6 characters.</div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader"><div class="spinner"></div></span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html">← Back to Store</a>
      </div>

      <div class="secure-badge">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Secured by Supabase Auth
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient(
      'https://pwlappfcyqechcoiqcjk.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3bGFwcGZjeXFlY2hjb2lxY2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzA0NjUsImV4cCI6MjA4ODU0NjQ2NX0.364XmLPVCFGDVlrdNrW_JAOUQXmAKDYyp_mfKDmMUGI'
    );

    // ── Redirect if already logged in ──────────────────────────
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'admin.html';

    // ── Password Toggle ────────────────────────────────────────
    const pwInput = document.getElementById('passwordInput');
    document.getElementById('pwToggle').addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      document.getElementById('pwEyeIcon').innerHTML = isHidden
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });

    // ── Form Submit ────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email    = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn      = document.getElementById('loginBtn');
      const alert    = document.getElementById('loginAlert');

      // Reset
      alert.classList.remove('show');
      document.getElementById('emailError').classList.remove('show');
      document.getElementById('passwordError').classList.remove('show');
      document.getElementById('emailInput').classList.remove('error');
      document.getElementById('passwordInput').classList.remove('error');

      // Validate
      let valid = true;
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailError').classList.add('show');
        document.getElementById('emailInput').classList.add('error');
        valid = false;
      }
      if (!password || password.length < 6) {
        document.getElementById('passwordError').classList.add('show');
        document.getElementById('passwordInput').classList.add('error');
        valid = false;
      }
      if (!valid) return;

      // Loading state
      btn.classList.add('loading');
      btn.disabled = true;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      btn.classList.remove('loading');
      btn.disabled = false;

      if (error) {
        alert.textContent = error.message === 'Invalid login credentials'
          ? 'Invalid email or password. Please try again.'
          : error.message;
        alert.classList.add('show');
        document.getElementById('emailInput').classList.add('error');
        document.getElementById('passwordInput').classList.add('error');
      } else {
        window.location.href = 'admin.html';
      }
    });

    // ── Cursor ─────────────────────────────────────────────────
    const dot=document.getElementById('cursorDot'), ring=document.getElementById('cursorRing');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
    (function anim(){ dot.style.left=mx+'px'; dot.style.top=my+'px'; rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(anim); })();
  </script>
</body>
</html>
